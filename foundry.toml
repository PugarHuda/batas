[profile.default]
src            = "src"
test           = "test"
out            = "out"
libs           = ["node_modules"]
solc_version   = "0.8.30"
evm_version    = "cancun"
optimizer      = true
optimizer_runs = 700
via_ir         = true

[fmt]
line_length          = 120
bracket_spacing      = true
number_underscore    = "thousands"
