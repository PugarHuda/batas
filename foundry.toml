[profile.default]
src            = "src"
test           = "test"
out            = "out"
libs           = ["node_modules"]
solc_version   = "0.8.30"
evm_version    = "cancun"
optimizer      = true
optimizer_runs = 700
via_ir         = true
# test/halmos/ is compiled by the halmos profile only. Adding a file to the compilation unit changes
# the router's via-IR bytecode by a few bytes (UPSTREAM.md), and deployed.test.mjs compares out/
# against Sepolia byte for byte; the symbolic tests must not move that target.
skip           = ["test/halmos/**"]

[profile.halmos]
skip           = []
out            = "out-halmos"

[fmt]
line_length          = 120
bracket_spacing      = true
number_underscore    = "thousands"

[fuzz]
# The cross-surface agreement is the property most worth hammering: a disagreement means a mandate
# says different things depending on which door a trade arrives through. 1 wei of dust already
# found one bug at the default run count.
runs = 2000
