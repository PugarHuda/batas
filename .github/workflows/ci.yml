name: ci

on:
  push:
  pull_request:

# Nothing here is a secret. A topic id and an account id are public by construction — the whole
# point of the publication ledger is that a stranger can read it — and no key is needed to assert
# what a 402 promises, only to settle one.
env:
  HEDERA_SERVICE_ID: "0.0.10388560"
  BATAS_HCS_TOPIC: "0.0.10394165"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "stable". agent/deployed.test.mjs compares the bytecode on Sepolia against a
      # local build, and forge 1.8.1 does not produce the same bytes for BatasRouter as the 1.8.0
      # that deployed it. Everything else here is already pinned — solc, the dependencies, the
      # swap-vm commit — and the toolchain was the one thing left that could move underneath a
      # deployment nobody had changed.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # `forge build` before `forge test`, and the order matters.
      #
      # The two commands do not compile src/ the same way: from a clean tree, `forge build` emits a
      # BatasRouter runtime of 20,538 bytes and `forge test` emits 20,596. The deployed contract is
      # the former, because that is what `forge create` produces. agent/deployed.test.mjs compares
      # the two, so it needs the build artifact — and once `forge build` has written it, `forge
      # test` reuses the cache rather than replacing it. `--force` because the cache, not the
      # command, decides: whichever compiled first wins, so a warm tree from a test run would
      # otherwise survive a plain `forge build`.
      - run: forge build --force

      # Contracts: unit tests plus the fuzzed agreement between the two enforcement surfaces.
      - run: npm run test:sol

      # The decoder the paid service sells, the numbers the agent picks, the ENSv2 role bitmaps,
      # and the two records the paid answer carries. Run through the npm script rather than a
      # copied list of files: this workflow had its own list, it fell behind package.json, and two
      # test files simply stopped being run by CI without anything going red.
      - run: npm run test:js

      # The paid HTTP surface, including what its 402 promises.
      - run: npm run test:api
